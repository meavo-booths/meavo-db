name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Validate schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Validate Prisma schema
        # Prisma resolves env("DATABASE_URL") while parsing the schema, so the
        # variable must exist even though validation never opens a connection.
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: npx prisma validate

      # `npm run diff` is deliberately not run here: it connects to the live
      # database, so it would require production credentials in CI. Review
      # destructive schema changes against the pinned-tag policy in the PR instead.
