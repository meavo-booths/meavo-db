name: Release policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  release-policy:
    name: Release policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify policy and main pull request source
        run: python3 scripts/verify-release-policy.py --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME"
      - name: Verify canonical templates and tooling
        if: github.repository == 'meavo-booths/meavo-agent-templates'
        run: |
          python3 scripts/sync-release-policy.py . --check
          python3 -m unittest discover -s tests -v
